[workspace]
resolver = "2"
members = [
    "crates/x-core",
    "crates/x-components",
    "crates/x-render",
    "crates/x-text",
    "crates/x-editor",
    "crates/x-format",
    "crates/x-native",
    "crates/x-ui",
    "crates/x-board",
    "crates/x-wasm",
    "apps/x-designer",
]

# Project-wide lint policy. Crates opt in with `[lints] workspace = true`.
# `unsafe_code` is denied rather than forbidden because one benchmark binary
# (`apps/x-designer/src/bin/bench_scale.rs`) implements a counting global
# allocator; that file carries a documented `#![allow(unsafe_code)]`. Anything
# else that grows an `unsafe` block fails the gate in `scripts/check.sh`.
[workspace.lints.rust]
unsafe_code = "deny"
unused_must_use = "deny"
missing_debug_implementations = "allow"

[workspace.lints.clippy]
# Correctness first: these are the families that catch real bugs in a
# geometry/serialization codebase. Style lints stay off so the diff noise of
# a formatter opinion never blocks a contribution.
correctness = { level = "deny", priority = -1 }
suspicious = { level = "deny", priority = -1 }
style = { level = "warn", priority = -1 }
complexity = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
# Individual lints (priority 0) override the groups above (priority -1).
dbg_macro = "deny"
todo = "deny"
print_stdout = "allow"
# The engine deliberately owns error strings instead of error types.
missing_errors_doc = "allow"
doc_markdown = "allow"
too_many_arguments = "allow"
should_implement_trait = "allow"
# NOTE: crate metadata (version/license) is deliberately not consolidated
# here yet — see docs/KNOWN_DEBT.md ("crate metadata drifts").
