[package]
name = "x-wasm"
version = "0.34.0"
edition = "2021"

# cdylib is what wasm-bindgen links; rlib keeps `cargo test` able to see the
# crate on a normal host target.
[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
kurbo = "0.13"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1"
x-core = { path = "../x-core" }
x-editor = { path = "../x-editor" }
x-format = { path = "../x-format" }
# The export bridge renders with the crate the desktop app exports with, so
# one pipeline answers both tiers (audit F1). `vello`'s pure-CPU sinks stay
# off - only the IR builder and tiny-skia rasterizer are used.
x-render = { path = "../x-render" }

# Keep JavaScript bindings out of the native editor/core crates. The typed POC
# command API uses direct JS values instead of serializing command/state JSON.
[target.'cfg(target_arch = "wasm32")'.dependencies]
# x-render pulls uuid v4 -> getrandom, whose wasm32-unknown-unknown backend
# must be opted into explicitly or the bundle fails to link.
getrandom = { version = "0.4", features = ["wasm_js"] }
serde-wasm-bindgen = "0.6.5"
wasm-bindgen = "0.2.127"

[lints]
workspace = true
