[package]
name = "x-render"
version = "0.34.0"
edition = "2021"
[dependencies]
vello = { version = "0.10", default-features = false }
png = "0.18.1"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg"] }
miniz_oxide = "0.8"
tiny-skia = "0.12"
jpeg-encoder = "0.7"
x-core = { path = "../x-core" }
x-text = { path = "../x-text" }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
uuid = { version = "1.0", features = ["v4", "serde"] }

[dev-dependencies]
x-components = { path = "../x-components" }

[lints]
workspace = true
