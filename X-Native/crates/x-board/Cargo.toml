[package]
name = "x-board"
version = "0.1.0"
edition = "2021"
description = "Infinite canvas brainstorming and UX mapping module for X-Native"
license = "MIT"

[dependencies]
x-core = { path = "../x-core" }
x-editor = { path = "../x-editor" }
x-render = { path = "../x-render" }
x-format = { path = "../x-format" }
x-ui = { path = "../x-ui" }

serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
glam = { version = "0.29", features = ["serde"] }
lru = "0.12"
rayon = "1.10"
uuid = { version = "1.0", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }

[lib]
path = "src/lib.rs"

[lints]
workspace = true
