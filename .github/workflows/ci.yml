# The repository gate. `X-Native/scripts/check.sh` is the single definition of
# "green" — this workflow runs exactly that script so "it passes locally" and
# "it passes on CI" are the same claim. Before this file existed the repo
# shipped no checks at all.
name: CI

on:
  push:
    branches: ["main", "arena/**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: scripts/check.sh
    runs-on: ubuntu-latest
    # The workspace pulls vello/wgpu/winit; a cold dependency build plus the
    # full test suite is minutes, not seconds. If this job fails early, suspect
    # the environment (dependency download, cache) before the code — the gate
    # compiles ~400 crates before it reaches any of ours.
    timeout-minutes: 60
    defaults:
      run:
        working-directory: X-Native
    steps:
      - uses: actions/checkout@v4

      # System libraries the GUI stack (winit / wgpu / arboard) links against
      # on Linux. Without them the build fails inside a C dependency rather
      # than on any Rust error.
      - name: Linux build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            pkg-config libssl-dev \
            libx11-dev libxcb1-dev libxkbcommon-dev libwayland-dev libudev-dev

      # Honours X-Native/rust-toolchain.toml — 1.98.1 with rustfmt + clippy,
      # the exact toolchain the gate asserts against.
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: true

      # `bash scripts/check.sh`, not `./scripts/check.sh`: the script is
      # committed 100644 (non-executable), so the direct form fails with
      # "permission denied".
      - name: Gate
        run: |
          set -o pipefail
          bash scripts/check.sh 2>&1 | tee /tmp/gate.log

      # The gate's output again as a summary, which is easier to read than a
      # 10k-line step log when something fails.
      - name: Gate output
        if: failure()
        run: |
          {
            echo '### `scripts/check.sh` failed'
            echo
            echo '```'
            cat /tmp/gate.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # Short, one-line annotations for the lines that explain a failure: the
      # gate's per-step verdicts, the diagnostics it printed, and the first
      # hunks of a formatting diff. These are readable through the check-runs
      # API — large multi-line annotations get dropped on the floor.
      - name: Annotate failures
        if: failure()
        run: |
          test -f /tmp/gate.log || exit 0
          esc=$(printf '\033')
          annotate() { # $1 pattern, $2 max lines
            grep -aE "$1" /tmp/gate.log 2>/dev/null |
              sed -e "s/${esc}\[[0-9;]*m//g" -e 's/\r//g' -e 's/%/%25/g' |
              cut -c1-400 |
              head -"$2" |
              while IFS= read -r line; do printf '::error::%s\n' "$line"; done
          }
          annotate '==>|^ *ok |FAIL' 20
          annotate 'error(\[|:| from )' 12
          annotate 'Diff in|needs to be updated|not found|No such file' 8
