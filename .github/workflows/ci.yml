# The repository gate. `X-Native/scripts/check.sh` is the single definition of
# "green" — this workflow runs exactly that script so "it passes locally" and
# "it passes on CI" are the same claim. Before this file existed the repo
# shipped no checks at all.
#
# A failing gate is reported twice: as short annotations (the only failure
# channel reachable through the check-runs API) and as a PR comment carrying
# the full log (the raw step log is served from blob storage, which some
# tooling cannot reach).
name: CI

on:
  push:
    branches: ["main", "arena/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: scripts/check.sh
    runs-on: ubuntu-latest
    # The workspace pulls vello/wgpu/winit; a cold dependency build plus the
    # full test suite is minutes, not seconds. If this job fails early, suspect
    # the environment (dependency download, cache) before the code — the gate
    # compiles ~400 crates before it reaches any of ours.
    timeout-minutes: 60
    defaults:
      run:
        working-directory: X-Native
    steps:
      - uses: actions/checkout@v4

      # System libraries the GUI stack (winit / wgpu / arboard) links against
      # on Linux. Without them the build fails inside a C dependency rather
      # than on any Rust error.
      - name: Linux build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            pkg-config libssl-dev \
            libx11-dev libxcb1-dev libxkbcommon-dev libwayland-dev libudev-dev

      # Honours X-Native/rust-toolchain.toml. Both inputs are set explicitly:
      # without them the action reliably did nothing, and the gate then watched
      # rustup auto-install 1.98.1 mid-run — fmt/clippy/test/CLI-build all
      # failed with exit codes and no diagnostics.
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: "1.98.1"
          components: rustfmt, clippy
          # This action defaults build-warnings to "deny", i.e. it exports
          # CARGO_BUILD_WARNINGS=deny and turns every warning into an error.
          # That contradicts this repo's own policy: scripts/check.sh tolerates
          # dead code up to DEAD_CODE_CEILING and only fails on lints outside
          # the budget. Empty = the documented gate.
          build-warnings: ""
          cache: true

      # Fail here, loudly, if the toolchain is incomplete — not 90 seconds
      # later inside the gate as a mysterious exit 101.
      - name: Toolchain
        run: |
          rustup show active-toolchain
          cargo --version
          rustc --version
          rustfmt --version
          cargo clippy --version

      # `bash scripts/check.sh`, not `./scripts/check.sh`: the script is
      # committed 100644 (non-executable), so the direct form fails with
      # "permission denied".
      #
      # The gate writes to a FILE, not into a pipeline: `check.sh | tee` loses
      # output when the log sink stops reading (the step log dies with a broken
      # pipe and the pipeline's status becomes tee's 0, masking the failure).
      - name: Gate
        run: |
          set +e
          bash scripts/check.sh > /tmp/gate.log 2>&1
          status=$?
          cat /tmp/gate.log || true
          exit $status

      # scripts/check.sh is deliberately opaque: cargo writes into temp files it
      # greps, the CLI build sends stderr to /dev/null, and the clippy branch
      # prints only lines starting with "error". When the gate fails, re-run the
      # phases it covers with nothing filtered out, and publish that alongside
      # the gate's own log.
      #
      # The publish step is a PR comment because the raw step log is served from
      # blob storage (unreachable from some tooling) and large multi-line
      # annotations are dropped by GitHub.
      - name: Diagnose
        if: failure()
        run: |
          set +e
          report=/tmp/report.txt
          : > "$report"
          phase() {
            printf '\n########## %s ##########\n' "$1" >> "$report"
            shift
            "$@" >> "$report" 2>&1
            printf '########## exit: %s\n' "$?" >> "$report"
          }
          phase "cargo --version" cargo --version
          phase "rustc --version" rustc --version
          phase "cargo build --workspace" cargo build --workspace
          phase "cargo clippy --workspace --all-targets" cargo clippy --workspace --all-targets --message-format short
          phase "cargo test --workspace --locked" cargo test --workspace --locked --no-fail-fast
          phase "cargo build -p x-designer --bin x_native" cargo build -p x-designer --bin x_native
          echo "report: $(wc -c < "$report") bytes"
          tail -c 4000 "$report"
          exit 0

      - name: Report failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          esc=$(printf '\033')
          if [ -f /tmp/gate.log ]; then
            grep -aE '==>|FAIL|error|warning|Diff|panicked|\.rs:[0-9]+' /tmp/gate.log |
              sed -e "s/${esc}\[[0-9;]*m//g" -e 's/%/%25/g' -e 's/\r//g' |
              cut -c1-350 | head -35 |
              while IFS= read -r line; do printf '::error::%s\n' "$line"; done
          fi
          number=$(gh pr list --head "$GITHUB_REF_NAME" --state open \
                     --json number --jq '.[0].number' 2>/dev/null || true)
          if [ -n "$number" ]; then
            {
              echo "Gate failed on \`${GITHUB_SHA:0:7}\` — gate log, then the raw output of each phase."
              echo
              echo '~~~'
              cat /tmp/gate.log 2>/dev/null
              echo '~~~'
              echo '~~~'
              head -c 55000 /tmp/report.txt 2>/dev/null
              echo '~~~'
            } > /tmp/ci-comment.md
            gh pr comment "$number" --body-file /tmp/ci-comment.md || true
          fi
