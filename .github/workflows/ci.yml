# The repository gate. `X-Native/scripts/check.sh` is the single definition of
# "green" — this workflow runs exactly that script so "it passes locally" and
# "it passes on CI" are the same claim. Before this file existed the repo
# shipped no checks at all.
#
# A failing gate is reported twice: as short annotations (the only failure
# channel reachable through the check-runs API) and as a PR comment carrying
# the full log (the raw step log is served from blob storage, which some
# tooling cannot reach).
name: CI

on:
  push:
    branches: ["main", "arena/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: scripts/check.sh
    runs-on: ubuntu-latest
    # The workspace pulls vello/wgpu/winit; a cold dependency build plus the
    # full test suite is minutes, not seconds. If this job fails early, suspect
    # the environment (dependency download, cache) before the code — the gate
    # compiles ~400 crates before it reaches any of ours.
    timeout-minutes: 60
    defaults:
      run:
        working-directory: X-Native
    steps:
      - uses: actions/checkout@v4

      # System libraries the GUI stack (winit / wgpu / arboard) links against
      # on Linux. Without them the build fails inside a C dependency rather
      # than on any Rust error.
      - name: Linux build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            pkg-config libssl-dev \
            libx11-dev libxcb1-dev libxkbcommon-dev libwayland-dev libudev-dev

      # Honours X-Native/rust-toolchain.toml. Both inputs are set explicitly:
      # without them the action reliably did nothing, and the gate then watched
      # rustup auto-install 1.98.1 mid-run — fmt/clippy/test/CLI-build all
      # failed with exit codes and no diagnostics.
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: "1.98.1"
          components: rustfmt, clippy
          cache: true

      # Fail here, loudly, if the toolchain is incomplete — not 90 seconds
      # later inside the gate as a mysterious exit 101.
      - name: Toolchain
        run: |
          rustup show active-toolchain
          cargo --version
          rustc --version
          rustfmt --version
          cargo clippy --version

      # `bash scripts/check.sh`, not `./scripts/check.sh`: the script is
      # committed 100644 (non-executable), so the direct form fails with
      # "permission denied".
      #
      # The gate writes to a FILE, not into a pipeline: `check.sh | tee` loses
      # output when the log sink stops reading (the step log dies with a broken
      # pipe and the pipeline's status becomes tee's 0, masking the failure).
      - name: Gate
        run: |
          set +e
          bash scripts/check.sh > /tmp/gate.log 2>&1
          status=$?
          cat /tmp/gate.log || true
          exit $status

      - name: Report failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test -f /tmp/gate.log || exit 0

          # short single-line annotations: large multi-line ones are dropped
          esc=$(printf '\033')
          grep -aE '==>|FAIL|error|warning|Diff|panicked|\.rs:[0-9]+' /tmp/gate.log |
            sed -e "s/${esc}\[[0-9;]*m//g" -e 's/%/%25/g' -e 's/\r//g' |
            cut -c1-350 | head -35 |
            while IFS= read -r line; do printf '::error::%s\n' "$line"; done

          # the whole log as a PR comment
          number=$(gh pr list --head "$GITHUB_REF_NAME" --state open \
                     --json number --jq '.[0].number' 2>/dev/null || true)
          if [ -n "$number" ]; then
            {
              echo "Gate failed on \`${GITHUB_SHA:0:7}\` (\`scripts/check.sh\`, full log)."
              echo
              echo '~~~'
              head -c 60000 /tmp/gate.log
              echo '~~~'
            } > /tmp/gate-comment.md
            gh pr comment "$number" --body-file /tmp/gate-comment.md || true
          fi

      - name: Summary
        if: failure()
        run: |
          {
            echo '### `scripts/check.sh` failed'
            echo
            echo '```'
            cat /tmp/gate.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
