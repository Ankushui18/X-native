# The repository gate. `X-Native/scripts/check.sh` is the single definition of
# "green" — this workflow runs exactly that script so "it passes locally" and
# "it passes on CI" are the same claim. Before this file existed, a PR got zero
# checks and the gate had never run anywhere.
name: CI

on:
  push:
    branches: ["main", "arena/**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: scripts/check.sh
    runs-on: ubuntu-latest
    # The workspace pulls vello/wgpu/winit; a cold build plus the full test
    # suite is minutes, not seconds.
    timeout-minutes: 60
    defaults:
      run:
        working-directory: X-Native
    steps:
      - uses: actions/checkout@v4

      # System libraries the GUI stack (winit / wgpu / arboard) links against
      # on Linux. Without them the build fails at the C-dependency step rather
      # than on any Rust error.
      - name: Linux build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            pkg-config libssl-dev \
            libx11-dev libxcb1-dev libxkbcommon-dev libwayland-dev libudev-dev

      # Honours X-Native/rust-toolchain.toml — 1.98.1 with rustfmt + clippy,
      # the exact toolchain the gate asserts against.
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: true

      - name: Rust version
        run: |
          cargo --version && rustc --version
          rustfmt --version || true
          cargo clippy --version || true

      # Bash, not `./scripts/check.sh`: the script was committed non-executable
      # (mode 100644), which is why running it locally fails with "permission
      # denied".
      #
      # The gate's output is mirrored into the job summary: the raw step log
      # lives on blob storage, so a failure is otherwise unreadable from any
      # tooling that only speaks the REST API (and unreadable entirely if the
      # blob host is unreachable).
      - name: Gate
        run: |
          set +e
          bash scripts/check.sh > /tmp/gate.log 2>&1
          status=$?
          {
            echo "### \`scripts/check.sh\` exit: **$status**"
            echo
            echo "| tool | version |"
            echo "|---|---|"
            echo "| cargo | \`$(cargo --version 2>&1)\` |"
            echo "| rustc | \`$(rustc --version 2>&1)\` |"
            echo "| rustfmt | \`$(rustfmt --version 2>&1)\` |"
            echo "| clippy | \`$(cargo clippy --version 2>&1)\` |"
            echo
            echo "#### gate output"
            echo
            echo '```'
            head -c 120000 /tmp/gate.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          # The raw step log lives on blob storage, which is unreachable from
          # some tooling, and step summaries are not exposed by the check-runs
          # API — so the gate's output is also emitted as annotations, which
          # ARE reachable through api.github.com. Newlines must be %0A-escaped
          # inside a workflow-command message, hence the dance below.
          sed -e 's/%/%25/g' -e 's/\r//g' /tmp/gate.log |
            tr '\n' '\036' |
            sed 's/\x1e/%0A/g' |
            fold -s -w 3000 |
            head -30 |
            while IFS= read -r chunk; do
              printf '::error::%s\n' "$chunk"
            done
          exit $status
