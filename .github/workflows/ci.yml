# The repository gate. `X-Native/scripts/check.sh` is the single definition of
# "green" — this workflow runs exactly that script so "it passes locally" and
# "it passes on CI" are the same claim. Before this file existed, a PR got zero
# checks and the gate had never run anywhere.
#
# The gate's output is published through BOTH the job summary and error
# annotations, from a step that runs even when the gate step itself dies: the
# raw step log is served from blob storage (unreachable from some tooling) and
# step summaries are not exposed by the check-runs API, while annotations are.
name: CI

on:
  push:
    branches: ["main", "arena/**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: scripts/check.sh
    runs-on: ubuntu-latest
    # The workspace pulls vello/wgpu/winit; a cold build plus the full test
    # suite is minutes, not seconds.
    timeout-minutes: 60
    defaults:
      run:
        working-directory: X-Native
    steps:
      - uses: actions/checkout@v4

      # System libraries the GUI stack (winit / wgpu / arboard) links against
      # on Linux. Without them the build fails at the C-dependency step rather
      # than on any Rust error.
      - name: Linux build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            pkg-config libssl-dev \
            libx11-dev libxcb1-dev libxkbcommon-dev libwayland-dev libudev-dev

      # Honours X-Native/rust-toolchain.toml — 1.98.1 with rustfmt + clippy,
      # the exact toolchain the gate asserts against.
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: true

      - name: Rust version
        run: |
          cargo --version && rustc --version
          rustfmt --version || true
          cargo clippy --version || true

      # Bash, not `./scripts/check.sh`: the script was committed non-executable
      # (mode 100644), which is why running it locally fails with "permission
      # denied". continue-on-error keeps the job alive so the log step below
      # always gets to publish what happened.
      - name: Gate
        id: gate
        continue-on-error: true
        run: |
          bash scripts/check.sh 2>&1 | tee /tmp/gate.log
          printf 'scripts/check.sh exited %s\n' "${PIPESTATUS[0]}" | tee /tmp/gate.exit

      - name: Gate log
        if: always()
        run: |
          echo "gate outcome: ${{ steps.gate.outcome }}"
          cat /tmp/gate.exit 2>/dev/null || echo "no exit line recorded"
          test -f /tmp/gate.log || exit 0

          {
            echo "### \`scripts/check.sh\`: **${{ steps.gate.outcome }}**"
            echo
            cat /tmp/gate.exit 2>/dev/null || true
            echo
            echo "| tool | version |"
            echo "|---|---|"
            echo "| cargo | \`$(cargo --version 2>&1)\` |"
            echo "| rustc | \`$(rustc --version 2>&1)\` |"
            echo "| rustfmt | \`$(rustfmt --version 2>&1)\` |"
            echo "| clippy | \`$(cargo clippy --version 2>&1)\` |"
            echo
            echo "#### gate output"
            echo
            echo '```'
            cat /tmp/gate.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          # Annotations are readable through api.github.com, so mirror the log
          # there too. Newlines must be %0A-escaped inside a workflow-command
          # message, hence the dance below.
          sed -e 's/%/%25/g' -e 's/\r//g' /tmp/gate.log |
            tr '\n' '\036' |
            sed 's/\x1e/%0A/g' |
            fold -s -w 3000 |
            head -20 |
            while IFS= read -r chunk; do
              printf '::error::%s\n' "$chunk"
            done

      - name: Verdict
        if: steps.gate.outcome != 'success'
        run: |
          echo "::error::scripts/check.sh failed — read the 'Gate log' step's annotations or summary"
          exit 1
